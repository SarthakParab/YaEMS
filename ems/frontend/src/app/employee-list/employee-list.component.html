<div class="container">
  <div class="header">
    <h1>Employees</h1>
    <button class="btn btn-primary" (click)="onAdd()">+ Add Employee</button>
  </div>

  <div class="search-bar">
    <input
      type="text"
      placeholder="Search by name..."
      [(ngModel)]="searchQuery"
      (input)="onSearch()"
      class="search-input"
    />
  </div>

  <div *ngIf="error" class="alert alert-error">{{ error }}</div>

  <div *ngIf="loading" class="loading">Loading...</div>

  <table *ngIf="!loading" class="table">
    <thead>
      <tr>
        <th>#</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Department</th>
        <th>Job Title</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let emp of employees; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ emp.firstName }}</td>
        <td>{{ emp.lastName }}</td>
        <td>{{ emp.email }}</td>
        <td>{{ emp.department }}</td>
        <td>{{ emp.jobTitle }}</td>
        <td>
          <button class="btn btn-sm btn-edit" (click)="onEdit(emp.id)">Edit</button>
          <button class="btn btn-sm btn-delete" (click)="onDelete(emp.id)">Delete</button>
        </td>
      </tr>
      <tr *ngIf="employees.length === 0">
        <td colspan="7" class="empty">No employees found.</td>
      </tr>
    </tbody>
  </table>
</div>
