<div class="container">
  <div class="card">
    <h2>{{ isEditMode ? 'Edit Employee' : 'Add Employee' }}</h2>

    <div *ngIf="error" class="alert alert-error">{{ error }}</div>
    <div *ngIf="loading && isEditMode" class="loading">Loading...</div>

    <form *ngIf="!loading || !isEditMode" (ngSubmit)="onSubmit()" #empForm="ngForm">

      <div class="form-row">
        <div class="form-group">
          <label>First Name *</label>
          <input
            type="text"
            name="firstName"
            [(ngModel)]="employee.firstName"
            required
            #firstName="ngModel"
            placeholder="John"
          />
          <span class="field-error" *ngIf="firstName.invalid && firstName.touched">
            First name is required.
          </span>
        </div>

        <div class="form-group">
          <label>Last Name *</label>
          <input
            type="text"
            name="lastName"
            [(ngModel)]="employee.lastName"
            required
            #lastName="ngModel"
            placeholder="Doe"
          />
          <span class="field-error" *ngIf="lastName.invalid && lastName.touched">
            Last name is required.
          </span>
        </div>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="employee.email"
          required
          email
          #email="ngModel"
          placeholder="john.doe@example.com"
        />
        <span class="field-error" *ngIf="email.invalid && email.touched">
          A valid email is required.
        </span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Department</label>
          <input
            type="text"
            name="department"
            [(ngModel)]="employee.department"
            placeholder="Engineering"
          />
        </div>

        <div class="form-group">
          <label>Job Title</label>
          <input
            type="text"
            name="jobTitle"
            [(ngModel)]="employee.jobTitle"
            placeholder="Software Engineer"
          />
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="empForm.invalid || loading"
        >
          {{ loading ? 'Saving...' : (isEditMode ? 'Update' : 'Create') }}
        </button>
      </div>

    </form>
  </div>
</div>
